<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Did you Bust?</h1>
        <div class="stats">
            <p>Times performed: <span id="counter">0</span></p>
            <p>Last time: <span id="last-time">N/A</span></p>
            <p>Time passed since last action: <span id="time-passed">0</span> seconds</p>
        </div>
        <button id="action-btn">Yes Daddy </button>
        <button id="reset-btn">Forget it</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
